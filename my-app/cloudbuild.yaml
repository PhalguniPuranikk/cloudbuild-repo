steps:
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'my-app'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/my-app'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/my-app'

images:
  - 'gcr.io/$PROJECT_ID/my-app'

options:
  logging: CLOUD_LOGGING_ONLY
